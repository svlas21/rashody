<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Расходы</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расходы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111211" media="(prefers-color-scheme: dark)">
<style>
  :root{
    --bg:#f4f3ef; --card:#ffffff; --ink:#151514; --ink2:#5d5b55; --line:#e4e2db;
    --accent:#1f7a5a; --accent-ink:#ffffff; --chip:#ffffff; --chip-on:#e3f1ea; --err:#b3261e;
    --key:#ffffff; --key-press:#e9e7e0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111211; --card:#1c1d1c; --ink:#f1f0ec; --ink2:#a9a79f; --line:#2d2e2c;
      --accent:#3fae84; --accent-ink:#06140e; --chip:#1f201f; --chip-on:#173328; --err:#ff8a80;
      --key:#232423; --key-press:#30312f;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .screen{display:none;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
  .screen.on{display:flex}

  /* шапка */
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px}
  .top h1{font-size:17px;font-weight:600;margin:0}
  .link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:8px 0;cursor:pointer}

  /* даты */
  .dates{display:flex;gap:8px;padding:8px 18px 0}
  .dchip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;position:relative}
  .dchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .dchip input{position:absolute;inset:0;opacity:0;width:100%;height:100%}

  /* сумма */
  .amount{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 18px}
  .amount .val{font-size:56px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .amount .val{display:flex;align-items:center;justify-content:center}
  .amount .val.zero .num,.amount .val.zero .cur{color:var(--ink2);opacity:.45}
  .caret{display:inline-block;width:3px;height:.9em;margin-left:3px;border-radius:2px;background:var(--accent);
    animation:blink 1.05s steps(1,end) infinite}
  @keyframes blink{0%,55%{opacity:1}55.01%,100%{opacity:0}}
  .amount .hint{color:var(--ink2);font-size:14px;margin-top:4px;min-height:19px;text-align:center}

  /* клавиатура */
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 10px}
  .k{height:58px;border:0;border-radius:14px;background:var(--key);color:var(--ink);
    font:inherit;font-size:26px;font-weight:500;box-shadow:0 1px 0 var(--line)}
  .k:active{background:var(--key-press)}
  .k.small{font-size:20px}
  .go{margin:0 14px 14px;height:56px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);
    font:inherit;font-size:18px;font-weight:700}
  .go:disabled{opacity:.35}
  .go.loading:disabled{opacity:.85}

  /* категории */
  .catsHead{padding:10px 18px 6px}
  .catsHead .sum{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
  .catsHead .sub{color:var(--ink2);font-size:14px}
  .note{margin:8px 18px 4px;width:calc(100% - 36px);border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
  .note:focus{outline:none;border-color:var(--accent)}
  .note.need,.note.need:focus{outline:none;border-width:2px;border-color:var(--err);box-shadow:0 0 0 3px color-mix(in srgb, var(--err) 18%, transparent)}
  .list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 24px}
  .gtitle{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cat{min-height:54px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:14px;
    padding:10px 12px;text-align:left;font:inherit;font-size:15px;line-height:1.25}
  .cat{display:flex;align-items:center;gap:10px;padding:8px 10px}
  .cat .ic{flex:0 0 36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px}
  .cat .nm{min-width:0;font-size:14.5px;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
  .cat:active{background:var(--chip-on);border-color:var(--accent)}
  .more{width:100%;margin-top:14px;border:1px dashed var(--line);background:none;color:var(--ink2);
    border-radius:14px;padding:12px;font:inherit}

  /* история */
  .row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px;margin-bottom:8px}
  .row .m{flex:1;min-width:0}
  .row .hic{flex:0 0 38px;height:38px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px}
  .row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .s{color:var(--ink2);font-size:13px}
  .row .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row.undone{opacity:.45}
  .row.undone .a{text-decoration:line-through}
  .ubtn{border:1px solid var(--line);background:none;color:var(--err);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px}
  .hhint{color:var(--ink2);font-size:13px;margin:2px 4px 10px}
  button.row{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .row.tap:active{background:var(--chip-on)}
  .row .chev{color:var(--ink2);font-size:22px;margin-left:2px}
  .sheetWrap{position:fixed;inset:0;z-index:25;display:none}
  .sheetWrap.on{display:block}
  .sheetBg{position:absolute;inset:0;background:rgba(0,0,0,.35);animation:fadeIn .2s ease}
  .sheetCard{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);
    border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:slideUp .25s ease}
  .sheetTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:17px}
  .fld{display:block;margin:10px 0}
  .fld span{display:block;font-size:13px;color:var(--ink2);margin:0 2px 5px}
  .fld input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
    padding:12px;font:inherit;font-size:17px;-webkit-appearance:none;appearance:none;min-height:48px}
  .fld input:focus{outline:none;border-color:var(--accent)}
  .edErr{color:var(--err);font-size:14px;min-height:18px;margin:2px 2px 8px}
  .sheetCard .go{width:100%;margin:0 0 10px}
  .del{width:100%;height:48px;border:1px solid var(--line);background:none;color:var(--err);border-radius:14px;font:inherit;font-weight:600}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .navr{display:flex;gap:16px}
  .mon{display:flex;align-items:center;justify-content:center;gap:18px;padding:2px 18px 6px}
  .mon b{font-size:17px;min-width:110px;text-align:center}
  .mbtn{width:40px;height:36px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:20px}
  .mbtn:disabled{opacity:.3}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .hero .lbl{color:var(--ink2);font-size:13px}
  .hero .big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .hero .of{color:var(--ink2);font-size:15px;margin-bottom:12px}
  .bar{position:relative;height:10px;border-radius:6px;background:var(--line);overflow:visible}
  .bar .f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
  .bar.sm{height:6px;border-radius:4px}
  .bar.sm .f{border-radius:4px}
  .bar .pace{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
  .pacel{font-size:12px;color:var(--ink2);margin-top:8px;display:flex;align-items:center;gap:6px}
  .pacel i{display:inline-block;width:2px;height:12px;background:var(--ink);border-radius:1px}
  .f.warn{background:#d99a00} .f.over{background:var(--err)} .f.none{background:var(--ink2);opacity:.35}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
  .stat{background:var(--bg);border-radius:12px;padding:10px}
  .stat .l{font-size:12px;color:var(--ink2)} .stat .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;margin-top:2px}
  .sv{margin-top:10px} .sv:first-of-type{margin-top:0}
  .svh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;margin-bottom:6px}
  .svh span:first-child{flex:1;min-width:0}
  .svh b{text-align:right}
  .svh b{font-variant-numeric:tabular-nums}
  .svs{font-size:12px;color:var(--ink2);margin-top:5px}
  .seg{display:flex;gap:6px;margin:4px 0 4px}
  .seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px}
  .seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .gh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
  .gh .t{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
  .gh .s{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .crow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
  .crow .top2{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .crow .ic2{flex:0 0 32px;height:32px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:17px}
  .crow .nm2{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25}
  .crow .nums{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
  .crow .nums span{color:var(--ink2)}
  .crow .st{font-size:12.5px;margin-top:6px;color:var(--ink2)}
  .st.warn{color:#a87400} .st.over{color:var(--err);font-weight:600}
  @media (prefers-color-scheme: dark){ .f.warn{background:#e0a91a} .st.warn{color:#e0b44a} }
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:space-around;
    background:color-mix(in srgb, var(--card) 92%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;max-width:140px;border:0;background:none;color:var(--ink2);font:inherit;font-size:11.5px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border-radius:12px}
  .tabbar button.on{color:var(--accent)}
  .tabbar button:active{background:var(--chip-on)}
  body:not(.nonav) .screen{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  body.nonav .tabbar{display:none}
  body:not(.nonav) .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
  .top .ttl{flex:1;text-align:center}
  .who{font-size:14px;color:var(--ink2);font-weight:600}
  .stat.inc{border:1px dashed var(--accent);text-align:left;font:inherit;color:inherit;cursor:pointer}
  .stat.inc:active{background:var(--chip-on)}
  .plusb{display:block;color:var(--accent);font-weight:700;font-size:12px;margin-top:1px;white-space:nowrap}
  .inctag{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 5px;margin-right:2px;vertical-align:1px}
  .row .a.plus{color:var(--accent)}
  .edInfo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;color:var(--ink2);margin:6px 0 12px;line-height:1.4}
  .incBanner{display:flex;align-items:center;gap:10px;margin:10px 18px 0;padding:12px 12px 12px 14px;border:1px solid var(--accent);
    background:var(--chip-on);color:var(--ink);border-radius:14px;font:inherit;text-align:left}
  .incBanner b{flex:1;font-size:15px}
  .incBanner i{font-style:normal;color:var(--accent);font-size:22px}
  .incBanner em{font-style:normal;color:var(--ink2);font-size:20px;padding:0 4px 0 8px}
  .mon.sm{padding:0 0 8px}
  .incList{max-height:38vh;overflow:auto;margin-bottom:4px}
  .incItem{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:12px;padding:10px 12px;margin-bottom:6px;font:inherit;text-align:left}
  .incItem.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent)}
  .incItem .n{flex:1;font-weight:600}
  .incItem .v{font-variant-numeric:tabular-nums;color:var(--ink2)}
  .incTotal{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);margin:2px 4px 8px}
  .incTotal b{color:var(--ink)}
  .incHint{font-size:13px;color:var(--ink2);margin:2px 2px 4px;min-height:17px}
  .v-receipt .stamp.ok{border-color:#1f7a5a;color:#1f7a5a}
  .empty{color:var(--ink2);text-align:center;padding:40px 0}

  /* уведомление */
  .toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;
    background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;
    transform:translateY(160%);transition:transform .25s ease;z-index:30}
  .toast.on{transform:none;pointer-events:auto}
  .toast:not(.on){pointer-events:none;transform:translateY(calc(100% + 140px))}
  .toast .t{flex:1;font-size:15px}
  .toast .t b{display:block;font-size:16px}
  .toast .dim{opacity:.7}
  .toast button{border:0;background:none;color:var(--bg);font:inherit;font-weight:700;text-decoration:underline;padding:6px}
  .toast.err{background:var(--err);color:#fff}
  .party{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
  .v-dim{position:absolute;inset:0;background:color-mix(in srgb, var(--bg) 55%, transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  
  .v-receipt{position:absolute;left:50%;top:42%;width:250px;background:#fbfaf6;color:#222;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;padding:18px 18px 70px;box-shadow:0 18px 40px rgba(0,0,0,.22)}
  .v-receipt .rh{text-align:center;font-size:12px;letter-spacing:.12em;color:#666}
  .v-receipt .dash{border-top:2px dashed #ccc;margin:10px 0}
  .v-receipt .line{font-size:15px}
  .v-receipt .note2{font-size:13px;color:#777;margin-top:4px;overflow-wrap:anywhere}
  .v-receipt .tot{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#555}
  .v-receipt .tot b{font-size:26px;color:#111}
  .v-receipt .teeth{position:absolute;left:0;right:0;bottom:-10px;height:10px;
    background:linear-gradient(-45deg,transparent 7px,#fbfaf6 0) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,#fbfaf6 0) 0 0/14px 10px repeat-x}
  .v-receipt .stamp{position:absolute;left:50%;top:auto;bottom:6px;transform:translate(-50%,0) rotate(-8deg);
    border:4px solid #c8352b;color:#c8352b;border-radius:10px;padding:6px 14px;font:900 22px/1 -apple-system,system-ui,sans-serif;
    letter-spacing:.04em;background:rgba(255,255,255,.35);opacity:0;mix-blend-mode:multiply}
  .busy{position:fixed;inset:0;background:color-mix(in srgb, var(--bg) 45%, transparent);display:none;z-index:28;
    align-items:center;justify-content:center}
  .busy.on{display:flex;animation:fadeIn .15s ease}
  .busy .spinbox{background:var(--card);border-radius:18px;padding:18px 22px;box-shadow:0 10px 30px rgba(0,0,0,.18);
    display:flex;align-items:center;gap:12px;font-weight:600}
  .spin{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid color-mix(in srgb, var(--accent) 22%, transparent);
    border-top-color:var(--accent);animation:rot .7s linear infinite;vertical-align:middle;flex:0 0 auto}
  .spin.sm{width:13px;height:13px;border-width:2px;margin-right:6px;border-color:rgba(127,127,127,.35);border-top-color:currentColor}
  @keyframes rot{to{transform:rotate(360deg)}}
  .netbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:40;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
  .netbar.on{opacity:1}
  .netbar::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;border-radius:2px;background:var(--accent);
    animation:netrun 1.1s ease-in-out infinite}
  @keyframes netrun{0%{left:-40%}100%{left:100%}}
  .sk{background:linear-gradient(90deg,color-mix(in srgb, var(--ink) 9%, var(--bg)) 0%,color-mix(in srgb, var(--ink) 3%, var(--bg)) 50%,color-mix(in srgb, var(--ink) 9%, var(--bg)) 100%);
    background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:12px}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .skt{height:13px;width:90px;margin:16px 4px 10px;border-radius:6px}
  .skc{height:54px}
  .skr{height:62px;margin-bottom:8px}
  .skh{height:220px;margin-bottom:12px;border-radius:18px}
  .go .spin.sm{border-color:rgba(255,255,255,.4);border-top-color:#fff}
</style>
</head>
<body>

<!-- Экран 1: сумма -->
<section class="screen on" id="s1">
  <div class="top">
    <h1>Новый расход</h1>
    <span class="who" id="whoLbl"></span>
  </div>
  <div class="dates" id="dates"></div>
  <button class="incBanner" id="incBanner" style="display:none"><span>💼</span><b id="incBannerText">Пришла зарплата? Внесите доход</b><i>›</i><em id="incBannerX" aria-label="Скрыть">×</em></button>
  <div class="amount">
    <div class="val zero" id="val">0 ₸</div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="pad" id="pad"></div>
  <button class="go" id="next" disabled>Выбрать категорию</button>
</section>

<!-- Экран 2: категория -->
<section class="screen" id="s2">
  <div class="top">
    <button class="link" id="back">‹ Сумма</button>
    <h1>Категория</h1>
    <span style="width:60px"></span>
  </div>
  <div class="catsHead">
    <div class="sum" id="sum2"></div>
    <div class="sub" id="date2"></div>
  </div>
  <input class="note" id="note" placeholder="Комментарий: что купили, где" maxlength="120" autocomplete="off">
  <div class="list" id="cats"></div>
</section>

<!-- Экран 3: история -->
<!-- Экран 4: план / факт -->
<section class="screen" id="s4">
  <div class="top">
    <h1 class="ttl">План / факт</h1>
  </div>
  <div class="mon">
    <button class="mbtn" id="mPrev">‹</button><b id="mName"></b><button class="mbtn" id="mNext">›</button>
  </div>
  <div class="list" id="dash"></div>
</section>

<section class="screen" id="s3">
  <div class="top">
    <h1 class="ttl">Последние записи</h1>
  </div>
  <div class="list" id="hist"></div>
</section>


<!-- Окно редактирования записи -->
<div class="sheetWrap" id="sheet">
  <div class="sheetBg" id="sheetBg"></div>
  <div class="sheetCard">
    <div class="sheetTop"><b id="edName"></b><button class="link" id="edClose">Закрыть</button></div>
    <div class="edInfo" id="edInfo" style="display:none"></div>

<script>
/* ===== НАСТРОЙКА: ссылка на веб-приложение Apps Script (заканчивается на /exec) ===== */
var API_URL = 'https://script.google.com/macros/s/AKfycbzyR4Ynj2Fd0FLniOWm0BN2iHE_K_J_9wfHOBujQ02MvFP_n07uRYEIeqK5YxjxQDLc/exec';
/* ===================================================================================== */

// Ключ и имя приходят из ссылки (?k=...&who=...) и запоминаются на телефоне.
var QS = new URLSearchParams(location.search);
var KEY = QS.get('k') || store('k') || '';
var WHO = QS.get('who') || store('who') || '';
if (QS.get('k')) store('k', KEY);
if (QS.get('who')) store('who', WHO);

/* Обёртка в стиле google.script.run, чтобы остальной код не менялся */
function runner(){
  var s, f, r = {
    withSuccessHandler: function(x){ s = x; return r; },
    withFailureHandler: function(x){ f = x; return r; },
    getCategories: function(date){ call('cats', { date: date }, s, f); },
    addExpense:    function(e){ call('add', e, s, f, true); },
    undoExpense:   function(id){ call('undo', { id: id }, s, f, true); },
    getRecent:     function(n){ call('recent', { limit: n }, s, f); },
    editExpense:   function(p){ call('edit', p, s, f, true); },
    getSummary:    function(m){ call('summary', { month: m }, s, f); },
    getIncome:     function(m){ call('income', { month: m }, s, f); },
    addIncome:     function(p){ call('addIncome', p, s, f, true); },
    incomeStatus:  function(){ call('incomeStatus', {}, s, f); }
  };
  return r;
}

/* Запрос к таблице. GET для чтения, POST для записи. Ответ: {ok, data} или {ok:false, error} */
function call(action, params, ok, fail, post){
  var body = Object.assign({ action: action, k: KEY }, params || {});
  var req = post
    ? fetch(API_URL, { method: 'POST', body: JSON.stringify(body) })   // text/plain — без лишнего preflight
    : fetch(API_URL + '?' + new URLSearchParams(body).toString());
  net(1);
  req.then(function(r){ return r.json(); })
     .then(function(j){ net(-1); if (j.ok) { if (ok) ok(j.data); } else if (fail) fail({ message: j.error }); })
     .catch(function(){ net(-1); if (fail) fail({ message: navigator.onLine ? 'Нет связи с таблицей' : 'Нет интернета' }); });
}

/* ---------- индикаторы загрузки ---------- */
var netCount = 0, netTimer;
function net(d){
  netCount = Math.max(0, netCount + d);
  clearTimeout(netTimer);
  // короткие ответы не мигают полоской: показываем, если запрос идёт дольше 150 мс
  if (netCount) netTimer = setTimeout(function(){ document.getElementById('netbar').classList.add('on'); }, 150);
  else document.getElementById('netbar').classList.remove('on');
}
function busy(on, text){
  $('busyText').textContent = text || 'Секунду…';
  $('busy').classList.toggle('on', !!on);
}
function skel(kind){
  var h = '', i;
  if (kind === 'grid') {
    for (var g = 0; g < 3; g++) {
      h += '<div class="sk skt"></div><div class="grid">';
      for (i = 0; i < 4; i++) h += '<div class="sk skc"></div>';
      h += '</div>';
    }
  } else if (kind === 'rows') {
    h = '<div class="sk skt" style="width:220px"></div>';
    for (i = 0; i < 6; i++) h += '<div class="sk skr"></div>';
  } else if (kind === 'dash') {
    h = '<div class="sk skh"></div><div class="sk skh" style="height:150px"></div><div class="sk skt"></div>';
    for (i = 0; i < 4; i++) h += '<div class="sk skr" style="height:82px"></div>';
  }
  return h;
}

/* Иконки категорий: [часть названия, иконка]. Проверяются сверху вниз,
   поэтому более точные слова стоят выше общих («интернет подписки» выше «интернет»).
   Чтобы поменять иконку — поправьте строку или добавьте новую. */
var ICONS = [
  ['зарплата', '💼'], ['аренда кв', '🔑'], ['доход маша', '👧'], ['доп.доход', '✨'], ['доп. доход', '✨'], ['подработ', '🧰'],
  ['ozon', '📦'], ['покупки', '📦'],
  ['рассрочка', '💳'], ['kaspi', '💳'],
  ['ком.услуги', '💡'], ['коммунал', '💡'],
  ['интернет подписки', '📺'], ['подписк', '📺'],
  ['связь', '📱'], ['интернет', '🌐'],
  ['охрана', '🛡️'], ['страховка', '📋'],
  ['долг', '🤝'], ['подушка', '🛟'], ['накоплен', '💰'], ['отложили', '💰'],
  ['отбасы', '🏦'], ['ипотека', '🏦'],
  ['продукты', '🛒'], ['овощи', '🥦'], ['мыломойка', '🧴'],
  ['еда вне дома', '🍽️'], ['развлечения', '🎉'], ['такси', '🚕'],
  ['одежда', '👕'], ['незапланир', '⚡'], ['красота', '💅'],
  ['ozon', '📦'], ['покупки', '📦'], ['английский', '🗣️'], ['книги', '📚'],
  ['охота', '🦆'], ['автомойка', '🧽'], ['бензин', '⛽'], ['парковка', '🅿️'],
  ['здоровье', '💊'], ['машин', '🔧'], ['подарки', '🎁'],
  ['ремонт дома', '🛠️'], ['для дома', '🏠'], ['налог', '🧾'], ['самокат', '🛴'],
  ['маша', '👧'], ['ричи', '🐱']
];
function icon(name){
  var n = String(name).toLowerCase();
  for (var i = 0; i < ICONS.length; i++) if (n.indexOf(ICONS[i][0]) >= 0) return ICONS[i][1];
  return '🏷️';
}

var state = { amount: '', date: today(), groups: null, catsFor: '', lastId: null };

function $(id){ return document.getElementById(id); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function iso(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function today(){ return iso(new Date()); }
function yesterday(){ var d = new Date(); d.setDate(d.getDate() - 1); return iso(d); }
function money(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₸'; }
var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function human(s){
  if (s === today()) return 'Сегодня';
  if (s === yesterday()) return 'Вчера';
  var p = s.split('-'); return (+p[2]) + ' ' + MONTHS_GEN[+p[1] - 1];
}
function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
function show(id){
  ['s1','s2','s3','s4'].forEach(function(s){ $(s).classList.toggle('on', s === id); });
  document.body.classList.toggle('nonav', id === 's2');      // на выборе категории панель не нужна
  var tab = id === 's2' ? 's1' : id;
  Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'), function(b){
    var on = b.dataset.go === tab; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false');
  });
}

/* ---------- даты ---------- */
function renderDates(){
  var box = $('dates'); box.innerHTML = '';
  var t = today(), y = yesterday(), other = state.date !== t && state.date !== y;
  [[t,'Сегодня'],[y,'Вчера']].forEach(function(x){
    var b = document.createElement('button'); b.className = 'dchip' + (state.date === x[0] ? ' on' : '');
    b.textContent = x[1]; b.onclick = function(){ setDate(x[0]); }; box.appendChild(b);
  });
  var c = document.createElement('label'); c.className = 'dchip' + (other ? ' on' : '');
  c.textContent = other ? human(state.date) : 'Другая дата';
  var inp = document.createElement('input'); inp.type = 'date'; inp.value = state.date; inp.max = t;
  inp.onchange = function(){ if (inp.value) setDate(inp.value); };
  c.appendChild(inp); box.appendChild(c);
}
function setDate(d){
  var monthChanged = d.slice(0,7) !== state.date.slice(0,7);
  state.date = d; renderDates();
  if (monthChanged) loadCats();
}

/* ---------- клавиатура ---------- */
function renderPad(){
  var keys = ['1','2','3','4','5','6','7','8','9','000','0','⌫'];
  keys.forEach(function(k){
    var b = document.createElement('button'); b.className = 'k' + (k === '000' || k === '⌫' ? ' small' : '');
    b.textContent = k; b.onclick = function(){ press(k); }; $('pad').appendChild(b);
  });
}
function press(k){
  var a = state.amount;
  if (k === '⌫') a = a.slice(0, -1);
  else if (a.length < 9) a = (a + k).replace(/^0+/, '');
  state.amount = a.slice(0, 9); renderAmount();
}
function renderAmount(){
  var n = Number(state.amount || 0);
  var digits = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  var caret = '<span class="caret" id="caret"></span>';
  // пусто: курсор перед серым «0», как перед подсказкой в поле ввода; иначе — после цифр
  $('val').innerHTML = n ? '<span class="num">' + digits + '</span>' + caret + '<span class="cur"> ₸</span>'
                         : caret + '<span class="num">0</span><span class="cur"> ₸</span>';
  $('val').classList.toggle('zero', !n);
  // перезапуск мигания, чтобы курсор был виден сразу после нажатия
  var c = $('caret'); c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';
  $('next').disabled = !n;
}

/* ---------- категории ---------- */
function loadCats(){
  var month = state.date.slice(0,7);
  var cached = store('cats:' + month);
  if (cached) { state.groups = cached; state.catsFor = month; renderCats(); }
  runner()
    .withSuccessHandler(function(res){
      state.groups = res.groups; state.catsFor = month; store('cats:' + month, res.groups); renderCats();
    })
    .withFailureHandler(function(e){
      if (!state.groups) $('cats').innerHTML = '<div class="empty">Не удалось загрузить категории.<br>' + esc(e.message) + '</div>';
    })
    .getCategories(state.date);
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function ordered(){
  var gs = (state.groups || []).slice(), who = (WHO || '').toLowerCase();
  function rank(g){
    var n = g.group.toLowerCase();
    if (who && n === who) return 0;
    if (n.indexOf('обязательн') >= 0) return 1;
    if (n.indexOf('переменн') >= 0) return 2;
    return 3;
  }
  gs.sort(function(a, b){ return rank(a) - rank(b); });
  return { main: gs.filter(function(g){ return !who || rank(g) < 3; }), rest: who ? gs.filter(function(g){ return rank(g) === 3; }) : [] };
}
function title(g){
  var n = g.group.toLowerCase();
  if (WHO && n === WHO.toLowerCase()) return 'Мои';
  if (n.indexOf('обязательн') >= 0) return 'Общие';
  return g.group;
}
function freq(){ return store('freq') || {}; }
function bump(key){ var f = freq(); f[key] = (f[key] || 0) + 1; store('freq', f); }

function renderCats(showRest){
  var box = $('cats'); box.innerHTML = '';
  if (!state.groups) { box.innerHTML = skel('grid'); return; }
  var all = {}; state.groups.forEach(function(g){ g.items.forEach(function(it){ all[it.key] = it; }); });
  var f = freq();
  var top = Object.keys(f).filter(function(k){ return all[k]; })
    .sort(function(a, b){ return f[b] - f[a]; }).slice(0, 6).map(function(k){ return all[k]; });
  if (top.length) section('Частые', top);
  var o = ordered();
  o.main.forEach(function(g){ section(title(g), g.items); });
  if (o.rest.length) {
    if (showRest) o.rest.forEach(function(g){ section(title(g), g.items); });
    else {
      var m = document.createElement('button'); m.className = 'more';
      m.textContent = 'Остальные категории (' + o.rest.map(title).join(', ') + ')';
      m.onclick = function(){ renderCats(true); }; box.appendChild(m);
    }
  }
  function section(t, items){
    var h = document.createElement('div'); h.className = 'gtitle'; h.textContent = t; box.appendChild(h);
    var grid = document.createElement('div'); grid.className = 'grid';
    items.forEach(function(it){
      var b = document.createElement('button'); b.className = 'cat';
      b.innerHTML = '<span class="ic">' + icon(it.name) + '</span><span class="nm">' + esc(it.name) + '</span>';
      b.onclick = function(){ save(it); }; grid.appendChild(b);
    });
    box.appendChild(grid);
  }
}

/* ---------- сохранение ---------- */
function save(it){
  var amount = Number(state.amount);
  if (!amount) return;
  if (!$('note').value.trim()) {
    $('note').classList.add('need');
    $('note').scrollIntoView({ block: 'center', behavior: 'smooth' });
    $('note').focus();
    toast('<b>Напишите комментарий</b>Без него трата не сохранится', false, true);
    return;
  }
  // Сразу показываем «Готово», а в таблицу отправляем в фоне.
  // Запись хранится в очереди на телефоне, пока таблица не подтвердит её.
  var e = { cid: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            date: state.date, key: it.key, name: it.name, amount: amount,
            note: $('note').value.trim(), who: WHO, tries: 0 };
  addPending(e);
  bump(it.key);
  state.amount = ''; $('note').value = ''; renderAmount();
  state.last = { cid: e.cid, id: null, undoWanted: false };
  var head = '<b>' + icon(e.name) + ' ' + money(e.amount) + ' — ' + esc(e.name) + '</b>';
  toast(head + '<span class="dim"><i class="spin sm"></i>Записываю в таблицу…</span>', true);
  show('s1');
  celebrate(money(e.amount), e.name, icon(e.name), e.note);

  send(e, function(r){
    if (!state.last || state.last.cid !== e.cid) return;
    state.last.id = r.id;
    if (state.last.undoWanted) { undo(r.id); return; }
    var extra = (r.spent != null && r.plan) ? 'В этом месяце: ' + money(r.spent) + ' из ' + money(r.plan)
              : (r.spent != null ? 'В этом месяце: ' + money(r.spent) : 'Записано в таблицу');
    updateToast(head + esc(extra));
  }, function(err){
    if (state.last && state.last.cid === e.cid && state.last.undoWanted) {
      removePending(e.cid); toast('<b>Запись отменена</b>'); return;
    }
    toast('<b>Пока не записалось: ' + esc(e.name) + ', ' + money(e.amount) + '</b>' +
          'Запись сохранена на телефоне и уйдёт в таблицу при следующем открытии. ' + esc(err.message), false, true);
  });
}

/* ---------- очередь неотправленных записей ---------- */
function getPending(){ return store('pending') || []; }
function addPending(e){ var p = getPending(); p.push(e); store('pending', p); }
function removePending(cid){ store('pending', getPending().filter(function(x){ return x.cid !== cid; })); }
function send(e, ok, fail){
  runner()
    .withSuccessHandler(function(r){ removePending(e.cid); if (ok) ok(r); })
    .withFailureHandler(function(err){
      var p = getPending(), x = p.find(function(y){ return y.cid === e.cid; });
      if (x) { x.tries = (x.tries || 0) + 1; if (x.tries >= 5) p = p.filter(function(y){ return y.cid !== e.cid; }); store('pending', p); }
      if (fail) fail(err);
    })
    .addExpense(e);
}
function flushPending(){
  var p = getPending(); if (!p.length) return;
  var left = p.length, okCount = 0;
  p.forEach(function(e){
    send(e, function(){ okCount++; if (--left === 0 && okCount) toast('<b>Досохранено записей: ' + okCount + '</b>Они не потерялись в прошлый раз'); },
            function(){ --left; });
  });
}

/* ---------- праздник после сохранения: чек со штампом «ПОТРАЧЕНО» ---------- */
function partyBox(){ var b = document.getElementById('party'); b.innerHTML = ''; return b; }
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }


/* B. Чек со штампом: чек выезжает сверху, штамп «ПОТРАЧЕНО» ставится с ударом */
function celebrate(amount, name, icon, note, stamp, head){
  var box = partyBox();
  var dim = el('div', 'v-dim'); box.appendChild(dim);
  var now = new Date(), hh = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  var r = el('div', 'v-receipt',
    '<div class="rh">' + (head || 'РАСХОДЫ') + ' · ' + hh + '</div><div class="dash"></div>' +
    '<div class="line"><span>' + icon + ' ' + esc(name) + '</span></div>' +
    (note ? '<div class="note2">' + esc(note) + '</div>' : '') +
    '<div class="dash"></div><div class="tot"><span>ИТОГО</span><b>' + amount + '</b></div>' +
    '<div class="teeth"></div>' +
    '<div class="stamp' + (stamp ? ' ok' : '') + '">' + (stamp || 'ПОТРАЧЕНО') + '</div>');
  box.appendChild(r);
  var T = 3000;
  dim.animate([{opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.85},{opacity:0}], {duration:T});
  r.animate([
    {transform:'translate(-50%,-140%)', opacity:1, easing:'cubic-bezier(.2,.8,.3,1)'},
    {transform:'translate(-50%,-50%)', opacity:1, offset:.18},
    {transform:'translate(-50%,-50%)', opacity:1, offset:.82, easing:'ease-in'},
    {transform:'translate(-50%,-50%) rotate(-3deg) translateY(40px)', opacity:0}], {duration:T})
    .onfinish = function(){ box.innerHTML = ''; };
  var s = r.querySelector('.stamp');
  s.animate([
    {opacity:0, transform:'translate(-50%,0) rotate(-8deg) scale(2.4)'},
    {opacity:1, transform:'translate(-50%,0) rotate(-8deg) scale(.92)', offset:.75},
    {opacity:1, transform:'translate(-50%,0) rotate(-8deg) scale(1)'}], {duration:260, delay:820, easing:'ease-in', fill:'both'});
  r.animate([{marginLeft:'0'},{marginLeft:'-5px'},{marginLeft:'5px'},{marginLeft:'-3px'},{marginLeft:'0'}], {duration:220, delay:1060});
}

var toastTimer;
function toast(html, canUndo, isErr){
  var t = $('toast'); $('toastText').innerHTML = html;
  t.classList.toggle('err', !!isErr); $('toastBtn').style.display = canUndo ? '' : 'none';
  t.classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, canUndo ? 6000 : 5000);
}
function undo(id, after){
  busy(true, 'Отменяю запись…');
  runner()
    .withSuccessHandler(function(){ busy(false); toast('<b>Запись отменена</b>'); if (after) after(); })
    .withFailureHandler(function(e){ busy(false); toast('<b>Не получилось отменить</b>' + esc(e.message), false, true); })
    .undoExpense(id);
}
function updateToast(html){
  $('toastText').innerHTML = html; clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ $('toast').classList.remove('on'); }, 4500);
}
$('toastBtn').onclick = function(){
  $('toast').classList.remove('on');
  var l = state.last; state.last = null; if (!l) return;
  if (l.id) undo(l.id);
  else { l.undoWanted = true; state.last = l; toast('<b>Отменяю…</b>'); }
};

/* ---------- история ---------- */
function loadHist(){
  $('hist').innerHTML = skel('rows');
  runner()
    .withSuccessHandler(function(rows){
      var box = $('hist'); box.innerHTML = '';
      if (!rows.length) { box.innerHTML = '<div class="empty">Пока ничего не внесено через приложение</div>'; return; }
      var hint = document.createElement('div'); hint.className = 'hhint'; hint.textContent = 'Нажмите на запись, чтобы изменить или удалить';
      box.appendChild(hint);
      rows.forEach(function(r){
        var el = document.createElement(r.undone ? 'div' : 'button'); el.className = 'row' + (r.undone ? ' undone' : ' tap');
        el.innerHTML = '<div class="hic">' + icon(r.name) + '</div><div class="m"><div class="n">' + esc(r.name) + '</div><div class="s">' + (r.income ? '<span class="inctag">доход</span> ' : '') + esc(human(r.date)) +
          (r.who ? ' · ' + esc(r.who) : '') + (r.note ? ' · ' + esc(r.note) : '') + '</div></div><div class="a' + (r.income ? ' plus' : '') + '">' + (r.income && !r.replaced ? '+' : '') + money(r.amount) + '</div>' +
          (r.undone ? '' : '<div class="chev">›</div>');
        if (!r.undone) el.onclick = function(){ openEdit(r); };
        box.appendChild(el);
      });
    })
    .withFailureHandler(function(e){ $('hist').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; })
    .getRecent(30);
}


/* ---------- редактирование записи ---------- */
var editing = null;
function openEdit(r){
  editing = r; $('toast').classList.remove('on');
  $('edName').innerHTML = icon(r.name) + ' ' + esc(r.name);
  $('edAmount').value = String(Math.round(r.amount));
  $('edDate').value = r.date; $('edDate').max = today();
  $('edNote').value = r.note || '';
  $('edErr').textContent = '';
  var inc = !!r.income;
  ['edAmount','edDate','edNote'].forEach(function(id){ $(id).parentNode.style.display = inc ? 'none' : ''; });
  $('edSave').style.display = inc ? 'none' : '';
  $('edInfo').style.display = inc ? '' : 'none';
  if (inc) $('edInfo').innerHTML = 'Доход ' + (r.replaced ? '(замена суммы) ' : '') + money(r.amount) + ' от ' + esc(human(r.date).toLowerCase()) +
    '.<br>Доход можно только удалить — тогда сумма в таблице вернётся как было. Внести заново — в «Бюджете».';
  $('sheet').classList.add('on');
}
function closeEdit(){ $('sheet').classList.remove('on'); editing = null; }
$('edClose').onclick = closeEdit;
$('sheetBg').onclick = closeEdit;
$('edAmount').oninput = function(){ this.value = this.value.replace(/\D/g, '').slice(0, 9); };
$('edSave').onclick = function(){
  if (!editing) return;
  var amount = Number($('edAmount').value), date = $('edDate').value, note = $('edNote').value.trim();
  if (!amount) { $('edErr').textContent = 'Введите сумму'; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { $('edErr').textContent = 'Выберите дату'; return; }
  if (!note) { $('edErr').textContent = 'Комментарий обязателен'; return; }
  if (amount === Math.round(editing.amount) && date === editing.date && note === (editing.note || '')) { closeEdit(); return; }
  var btn = $('edSave'); btn.disabled = true; btn.classList.add('loading'); btn.innerHTML = '<i class="spin sm"></i>Сохраняю…';
  var done = function(){ btn.disabled = false; btn.classList.remove('loading'); btn.textContent = 'Сохранить изменения'; };
  runner()
    .withSuccessHandler(function(res){
      done(); closeEdit();
      toast('<b>✓ Изменено: ' + esc(res.name) + ', ' + money(res.amount) + '</b>' + esc(human(res.date)));
      loadHist();
    })
    .withFailureHandler(function(e){ done(); $('edErr').textContent = 'Не сохранилось: ' + e.message; })
    .editExpense({ id: editing.id, amount: amount, date: date, note: note });
};
$('edDelete').onclick = function(){
  if (!editing) return;
  if ($('edDelete').dataset.sure !== '1') {
    $('edDelete').dataset.sure = '1'; $('edDelete').textContent = 'Точно удалить? Нажмите ещё раз';
    setTimeout(function(){ $('edDelete').dataset.sure = ''; $('edDelete').textContent = 'Удалить запись'; }, 3500);
    return;
  }
  $('edDelete').dataset.sure = ''; $('edDelete').textContent = 'Удалить запись';
  var id = editing.id; closeEdit();
  undo(id, loadHist);
};


/* ---------- план / факт ---------- */
var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var dash = { m: new Date().getMonth() + 1, onlyOver: false, data: null };
function dashTitle(){
  $('mName').textContent = MONTHS_NOM[dash.m - 1];
  $('mPrev').disabled = dash.m <= 1; $('mNext').disabled = dash.m >= 12;
}
function loadDash(){
  dashTitle();
  var m = dash.m, cached = store('sum:' + m);
  dash.data = cached; if (cached) renderDash(); else $('dash').innerHTML = skel('dash');
  runner()
    .withSuccessHandler(function(d){ if (dash.m !== m) return; dash.data = d; store('sum:' + m, d); renderDash(); })
    .withFailureHandler(function(e){ if (dash.m === m && !dash.data) $('dash').innerHTML = '<div class="empty">Не удалось загрузить.<br>' + esc(e.message) + '</div>'; })
    .getSummary(m);
}
function pct(a, b){ return b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0; }
function catState(c){
  if (!c.plan) return { cls: 'none', text: 'без плана' };
  var left = c.plan - c.spent;
  if (left < 0) return { cls: 'over', text: '⚠ перерасход ' + money(-left) };
  if (c.spent >= c.plan * 0.9) return { cls: 'warn', text: '● почти всё: осталось ' + money(left) };
  return { cls: '', text: 'осталось ' + money(left) };
}
function renderDash(){
  var d = dash.data, box = $('dash'); box.innerHTML = '';
  if (!d) return;
  if (d.missing) { box.innerHTML = '<div class="empty">Листа «' + esc(d.sheet) + '» в таблице пока нет</div>'; return; }
  var t = d.totals || {}, spent = t.spent || 0, plan = t.plan || 0;
  var now = new Date(), cur = (now.getMonth() + 1 === d.month);
  var dim = new Date(now.getFullYear(), d.month, 0).getDate();
  var pace = cur ? now.getDate() / dim : null;

  // главная карточка
  var over = plan && spent > plan, fcls = over ? 'over' : (pace != null && plan && spent / plan > pace + 0.1 ? 'warn' : '');
  var hero = '<div class="card hero"><div class="lbl">Потрачено за месяц</div>' +
    '<div class="big">' + money(spent) + '</div><div class="of">из ' + money(plan) + ' по плану · ' + Math.round(plan ? spent / plan * 100 : 0) + '%</div>' +
    '<div class="bar"><div class="f ' + fcls + '" style="width:' + pct(spent, plan) + '%"></div>' +
    (pace != null ? '<div class="pace" style="left:calc(' + (pace * 100) + '% - 1px)"></div>' : '') + '</div>' +
    (pace != null ? '<div class="pacel"><i></i>сегодня ' + now.getDate() + '-е: по плану к этому дню ' + money(plan * pace) + '</div>' : '') +
    '<div class="stats">' +
      '<button class="stat inc" id="incStat"><div class="l">Доходы <span class="plusb">+ внести</span></div><div class="v">' + money(t.income || 0) + '</div></button>' +
      '<div class="stat"><div class="l">Сальдо</div><div class="v">' + money(t.saldo != null ? t.saldo : (t.income || 0) - spent) + '</div></div>' +
      '<div class="stat"><div class="l">' + (over ? 'Сверх плана' : 'Осталось') + '</div><div class="v" style="' + (over ? 'color:var(--err)' : '') + '">' + money(Math.abs(plan - spent)) + '</div></div>' +
    '</div></div>';
  box.insertAdjacentHTML('beforeend', hero);
  $('incStat').onclick = function(){ openIncome(d.month); };

  // накопления
  if (d.savings && d.savings.length) {
    var sv = '<div class="card"><div class="lbl" style="color:var(--ink2);font-size:13px;margin-bottom:10px">Накопления</div>';
    d.savings.forEach(function(s){
      var g = s.goal || 0, v = s.saved || 0;
      sv += '<div class="sv"><div class="svh"><span>' + esc(s.name) + '</span><b>' + money(v) + (g ? ' <span style="color:var(--ink2);font-weight:400">из ' + money(g) + '</span>' : '') + '</b></div>' +
        (g ? '<div class="bar sm"><div class="f" style="width:' + pct(v, g) + '%"></div></div><div class="svs">' + Math.round(v / g * 100) + '% · осталось ' + money(Math.max(0, g - v)) + '</div>' : '') + '</div>';
    });
    box.insertAdjacentHTML('beforeend', sv + '</div>');
  }

  // фильтр
  var nOver = d.cats.filter(function(c){ return c.plan && c.spent > c.plan; }).length;
  var seg = document.createElement('div'); seg.className = 'seg';
  seg.innerHTML = '<button class="' + (dash.onlyOver ? '' : 'on') + '">Все категории</button><button class="' + (dash.onlyOver ? 'on' : '') + '">Перерасход · ' + nOver + '</button>';
  seg.children[0].onclick = function(){ dash.onlyOver = false; renderDash(); };
  seg.children[1].onclick = function(){ dash.onlyOver = true; renderDash(); };
  box.appendChild(seg);

  // группы в том же порядке, что и на экране категорий
  var groups = [];
  d.cats.forEach(function(c){
    if (!c.plan && !c.spent) return;
    if (dash.onlyOver && !(c.plan && c.spent > c.plan) && !(!c.plan && c.spent)) return;
    var g = groups.find(function(x){ return x.group === c.group; });
    if (!g) { g = { group: c.group, items: [] }; groups.push(g); }
    g.items.push(c);
  });
  var who = (WHO || '').toLowerCase();
  function rank(g){ var n = g.group.toLowerCase(); return who && n === who ? 0 : n.indexOf('обязательн') >= 0 ? 1 : n.indexOf('переменн') >= 0 ? 2 : 3; }
  groups.sort(function(a, b){ return rank(a) - rank(b); });
  if (!groups.length) box.insertAdjacentHTML('beforeend', '<div class="empty">' + (dash.onlyOver ? 'Перерасхода нет 👍' : 'Нет данных') + '</div>');
  groups.forEach(function(g){
    var gs = 0, gp = 0; g.items.forEach(function(c){ gs += c.spent; gp += c.plan; });
    var html = '<div class="gh"><span class="t">' + esc(title(g)) + '</span>' + (dash.onlyOver ? '' : '<span class="s">' + money(gs) + ' / ' + money(gp) + '</span>') + '</div>';
    g.items.forEach(function(c){
      var st = catState(c);
      html += '<div class="crow"><div class="top2"><div class="ic2">' + icon(c.name) + '</div><div class="nm2">' + esc(c.name) + '</div>' +
        '<div class="nums">' + money(c.spent) + ' <span>/ ' + (c.plan ? money(c.plan) : '—') + '</span></div></div>' +
        '<div class="bar sm"><div class="f ' + st.cls + '" style="width:' + (c.plan ? pct(c.spent, c.plan) : 100) + '%"></div></div>' +
        '<div class="st ' + st.cls + '">' + st.text + '</div></div>';
    });
    box.insertAdjacentHTML('beforeend', html);
  });
}
$('mPrev').onclick = function(){ if (dash.m > 1) { dash.m--; loadDash(); } };
$('mNext').onclick = function(){ if (dash.m < 12) { dash.m++; loadDash(); } };


/* ---------- доходы ---------- */
var inc = { m: new Date().getMonth() + 1, data: null, sel: null, mode: 'add' };
function openIncome(m){
  inc.m = m || (new Date().getMonth() + 1); inc.sel = null; inc.mode = 'add';
  $('toast').classList.remove('on');
  $('incSheet').classList.add('on');
  loadIncome();
}
function closeIncome(){ $('incSheet').classList.remove('on'); }
function loadIncome(){
  $('iMonth').textContent = MONTHS_NOM[inc.m - 1];
  $('iPrev').disabled = inc.m <= 1; $('iNext').disabled = inc.m >= 12;
  $('incForm').style.display = 'none'; $('incErr').textContent = '';
  var cached = store('inc:' + inc.m); inc.data = cached;
  if (cached) renderIncome(); else $('incList').innerHTML = skel('rows').replace('<div class="sk skt" style="width:220px"></div>', '');
  var m = inc.m;
  runner()
    .withSuccessHandler(function(d){ if (inc.m !== m) return; inc.data = d; store('inc:' + m, d); renderIncome(); })
    .withFailureHandler(function(e){ if (inc.m === m && !inc.data) $('incList').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; })
    .getIncome(m);
}
function renderIncome(){
  var d = inc.data, box = $('incList'); box.innerHTML = '';
  if (!d) return;
  if (d.missing) { box.innerHTML = '<div class="empty">Листа «' + esc(d.sheet) + '» в таблице пока нет</div>'; return; }
  var total = 0; d.items.forEach(function(x){ total += x.amount || 0; });
  box.insertAdjacentHTML('beforeend', '<div class="incTotal"><span>Всего за месяц</span><b>' + money(total) + '</b></div>');
  // своя зарплата выбирается сама
  if (!inc.sel && WHO) { var mine = d.items.find(function(x){ return x.name.toLowerCase().indexOf(WHO.toLowerCase()) >= 0 && /зарплат/i.test(x.name); }); if (mine) inc.sel = mine.name; }
  d.items.forEach(function(x){
    var b = document.createElement('button'); b.className = 'incItem' + (inc.sel === x.name ? ' on' : '');
    b.innerHTML = '<span>' + icon(x.name) + '</span><span class="n">' + esc(x.name) + '</span><span class="v">' + (x.amount ? money(x.amount) : '—') + '</span>';
    b.onclick = function(){ inc.sel = x.name; renderIncome(); setTimeout(function(){ $('incAmount').focus(); }, 50); };
    box.appendChild(b);
  });
  var sel = d.items.find(function(x){ return x.name === inc.sel; });
  $('incForm').style.display = sel ? '' : 'none';
  if (sel) { setIncMode(inc.mode); }
}
function setIncMode(m){
  inc.mode = m;
  Array.prototype.forEach.call($('incMode').children, function(b){ b.classList.toggle('on', b.dataset.m === m); });
  var sel = inc.data && inc.data.items.find(function(x){ return x.name === inc.sel; });
  var cur = sel ? sel.amount || 0 : 0;
  $('incAmtLbl').textContent = m === 'add' ? 'Сколько пришло, ₸' : 'Новая сумма за месяц, ₸';
  $('incHint').textContent = sel ? (m === 'add'
    ? 'Сейчас в таблице ' + money(cur) + ' — сумма прибавится'
    : 'Сейчас в таблице ' + money(cur) + ' — заменится на новую (например, если там прошлый месяц)') : '';
}
Array.prototype.forEach.call($('incMode').children, function(b){ b.onclick = function(){ setIncMode(b.dataset.m); }; });
$('incAmount').oninput = function(){ this.value = this.value.replace(/\D/g, '').slice(0, 10); };
$('incClose').onclick = closeIncome; $('incBg').onclick = closeIncome;
$('iPrev').onclick = function(){ if (inc.m > 1) { inc.m--; inc.sel = null; loadIncome(); } };
$('iNext').onclick = function(){ if (inc.m < 12) { inc.m++; inc.sel = null; loadIncome(); } };
$('incSave').onclick = function(){
  var amount = Number($('incAmount').value), note = $('incNote').value.trim();
  if (!inc.sel) { $('incErr').textContent = 'Выберите статью дохода'; return; }
  if (inc.mode === 'add' ? !amount : $('incAmount').value === '') { $('incErr').textContent = 'Введите сумму'; return; }
  var btn = $('incSave'); btn.disabled = true; btn.classList.add('loading'); btn.innerHTML = '<i class="spin sm"></i>Сохраняю…';
  var done = function(){ btn.disabled = false; btn.classList.remove('loading'); btn.textContent = 'Сохранить доход'; };
  var name = inc.sel, mode = inc.mode, m = inc.m;
  runner()
    .withSuccessHandler(function(r){
      done(); closeIncome();
      $('incAmount').value = ''; $('incNote').value = '';
      store('inc:' + m, null); store('sum:' + m, null);
      $('incBanner').style.display = 'none';
      celebrate((mode === 'add' ? '+' : '') + money(r.amount), r.name, icon(r.name), note || (mode === 'set' ? 'сумма за месяц заменена' : ''), 'ПОЛУЧЕНО', 'ДОХОД');
      toast('<b>' + icon(r.name) + ' ' + (mode === 'add' ? '+' : '= ') + money(r.amount) + ' — ' + esc(r.name) + '</b>' +
            (r.total != null ? 'Теперь за ' + MONTHS_NOM[m - 1].toLowerCase() + ': ' + money(r.total) : ''));
      if ($('s4').classList.contains('on')) loadDash();
    })
    .withFailureHandler(function(e){ done(); $('incErr').textContent = 'Не сохранилось: ' + e.message; })
    .addIncome({ month: m, name: name, amount: amount, mode: mode, note: note, who: WHO });
};

/* Напоминание о зарплате: Настя — с 30-го (или последнего рабочего дня перед ним) 5 дней; Влад — с 1-го по 10-е */
function payWindows(now){
  var who = (WHO || '').toLowerCase(), wins = [];
  function d0(y, m, d){ return new Date(y, m, d); }
  if (who === 'настя') {
    [-1, 0].forEach(function(shift){
      var y = now.getFullYear(), m = now.getMonth() + shift; if (m < 0) { m = 11; y--; }
      var last = new Date(y, m + 1, 0).getDate(), day = Math.min(30, last), p = d0(y, m, day);
      while (p.getDay() === 0 || p.getDay() === 6) p = d0(y, m, p.getDate() - 1);
      wins.push({ start: p, end: d0(p.getFullYear(), p.getMonth(), p.getDate() + 5), month: p.getMonth() + 1 });
    });
  } else if (who === 'влад') {
    wins.push({ start: d0(now.getFullYear(), now.getMonth(), 1), end: d0(now.getFullYear(), now.getMonth(), 10), month: now.getMonth() + 1 });
  }
  var t = d0(now.getFullYear(), now.getMonth(), now.getDate());
  return wins.filter(function(w){ return t >= w.start && t <= w.end && w.start.getFullYear() === YEAR_OF_TABLE; });
}
var YEAR_OF_TABLE = 2026;
function checkIncomeBanner(){
  var w = payWindows(new Date())[0];
  if (!w) return;
  var startIso = iso(w.start);
  if (store('incHide:' + startIso)) return;
  runner().withSuccessHandler(function(res){
    var last = res && res.last ? res.last[WHO] : null;
    if (last && last >= startIso) return;           // уже внесли в этот период
    $('incBannerText').textContent = 'Пришла зарплата? Внесите доход за ' + MONTHS_NOM[w.month - 1].toLowerCase();
    $('incBanner').style.display = '';
    $('incBanner').onclick = function(e){ if (e.target.id === 'incBannerX') return; openIncome(w.month); };
    $('incBannerX').onclick = function(e){ e.stopPropagation(); store('incHide:' + startIso, 1); $('incBanner').style.display = 'none'; };
  }).incomeStatus();
}

/* ---------- навигация ---------- */
$('next').onclick = function(){
  $('sum2').textContent = money(Number(state.amount));
  $('date2').textContent = human(state.date);
  if (state.catsFor !== state.date.slice(0,7)) loadCats(); else renderCats();
  show('s2');
};
$('back').onclick = function(){ show('s1'); };
$('note').oninput = function(){ if ($('note').value.trim()) $('note').classList.remove('need'); };
Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'), function(b){
  b.onclick = function(){
    var go = b.dataset.go;
    show(go);
    if (go === 's3') loadHist();
    if (go === 's4') loadDash();
  };
});
if (WHO) $('whoLbl').textContent = WHO;

renderDates(); renderPad(); renderAmount(); $('cats').innerHTML = skel('grid');
if (!KEY || API_URL.indexOf('/exec') < 0) {
  toast('<b>Приложение не настроено</b>' + (!KEY ? 'Откройте его по полной ссылке с ключом (?k=…).' : 'В index.html не указана ссылка на Apps Script.'), false, true);
} else {
  loadCats(); flushPending(); checkIncomeBanner();
}
// неотправленные записи уходят, как только появился интернет или приложение снова открыли
addEventListener('online', flushPending);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') flushPending(); });
// при новом дне «Сегодня» должно указывать на новую дату
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState !== 'visible') return;
  if (!state.amount && state.date !== today()) setDate(today()); else renderDates();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
